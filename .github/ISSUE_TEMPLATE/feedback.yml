name: Feedback or idea
description: Share an idea or general feedback.
body:
  - type: markdown
    attributes:
      value: 'This issue is public. Please do not include private ride files, locations, device identifiers, or other personal information.'
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: Tell us what would improve your experience.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system, if relevant
