name: Feedback or problem
description: Share an idea or tell us what happened.
body:
  - type: markdown
    attributes:
      value: 'This issue is public. Please do not include private ride files, locations, device identifiers, or other personal information.'
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: For a problem, include steps to reproduce, what you expected, and what happened.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system, if relevant
