name: Bug report
description: Report a problem with indr.cc.
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: 'This issue is public. Do not include private ride files, locations, device identifiers, or other personal information.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem, if known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, version and operating system
      placeholder: e.g. Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Trainer or controller model and firmware, if relevant
  - type: textarea
    id: extra
    attributes:
      label: Additional details
      description: Include any useful non-personal error messages or context.
